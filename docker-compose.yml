services:

  # ============================================
  # FRONTEND SERVICE (Vue.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papairs-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=development
      - VITE_AUTH_SERVICE_URL=http://localhost:8081
      - VITE_DOCS_SERVICE_URL=http://localhost:8082
      - TZ=Europe/Copenhagen
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PORT=3000
    depends_on:
      - auth-service
      - docs-service
    networks:
      - papairs-network
    command: npm run dev
    restart: unless-stopped

  # ============================================
  # AUTH SERVICE (Spring Boot)
  # ============================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: papairs-auth-service
    ports:
      - "8081:8081"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./backend/auth-service/.env
    environment:
      - SERVER_PORT=8081
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - SESSION_DURATION_HOURS=48
      - TZ=Europe/Copenhagen
    networks:
      - papairs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # DOCS SERVICE (Spring Boot)
  # ============================================
  docs-service:
    build:
      context: ./backend/docs-service
      dockerfile: Dockerfile
    container_name: papairs-docs-service
    ports:
      - "8082:8082"
    env_file:
      - ./backend/docs-service/.env
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SERVER_PORT=8082
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - TZ=Europe/Copenhagen
    networks:
      - papairs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/docs/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # AI SERVICE (Node.js + OpenAI)
  # ============================================
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: papairs-ai-service
    ports:
      - "3001:3001"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./backend/ai-service/.env
    environment:
      - PORT=3001
      - TZ=Europe/Copenhagen
    networks:
      - papairs-network
    restart: unless-stopped
    stop_grace_period: 5s

  # ============================================
  # COLLABORATION SERVICE (Node.js + Hocuspocus)
  # ============================================
  collab-service:
    build:
      context: ./backend/collab-service
      dockerfile: Dockerfile
    container_name: papairs-collab-service
    ports:
      - "3004:3004"  # WebSocket port
      - "3005:3005"  # HTTP API port
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PORT=3004
      - TZ=Europe/Copenhagen
    networks:
      - papairs-network
    restart: unless-stopped
    stop_grace_period: 5s

# ============================================
# NETWORKS
# ============================================
networks:
  papairs-network:
    driver: bridge
